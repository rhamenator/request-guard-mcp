services:
  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${MCP_IMAGE:-request-guard-mcp:local}
    container_name: request-guard-mcp
    networks:
      default:
        aliases:
          - ai-scraping-defense-mcp
    restart: unless-stopped
    # Development main can drain active HTTP work for about 62s at default limits.
    stop_grace_period: 75s
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8085}:8085"
    environment:
      - MCP__HOST=0.0.0.0
      - MCP__PORT=8085
      - LOG_LEVEL=info
      - AUTH_TOKENS=${AUTH_TOKENS:?Set AUTH_TOKENS to a strong non-placeholder token}
      - CACHE_SCOPE_HMAC_KEY=${CACHE_SCOPE_HMAC_KEY:?Run python scripts/configure_credentials.py}
      - TLS_FINGERPRINT_ATTESTATION_KEY=${TLS_FINGERPRINT_ATTESTATION_KEY:?Run python scripts/configure_credentials.py}
      - MCP__REDIS__URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      - MCP__POSTGRES__URL=postgresql://mcp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/mcp
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: mcp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: mcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: mcp-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      mcp:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: mcp-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/request-guard.yml:ro
    depends_on:
      - prometheus

volumes:
  redis_data:
  postgres_data:
