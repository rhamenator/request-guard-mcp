name: Bug report
description: Report a reproducible problem in Request Guard MCP
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Request Guard MCP. Do not include credentials, tokens, private requests, or exploit details. Report security vulnerabilities privately through the repository security advisory page.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release, image tag, or commit are you using?
      placeholder: v1.2.3 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - MCP transport or protocol
        - Request classification or tool behavior
        - Authentication or security
        - Redis, PostgreSQL, or enrichment integration
        - Metrics or observability
        - Deployment, container, or Kubernetes
        - CI or release tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Rust version, deployment method, MCP client, and enabled features or integrations.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened, and how does it affect you?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction, using sanitized values.
      placeholder: |
        1. Configure ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or other evidence
      description: Remove secrets, tokens, personal data, private request content, and sensitive infrastructure details.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive data from this report.
          required: true
        - label: This is not a security vulnerability. Security vulnerabilities must be reported privately.
          required: true
