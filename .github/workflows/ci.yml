name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  npm-package:
    name: npm Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
      - run: node --check npm/bin/request-guard-mcp.js
      - run: node scripts/test_npm_launcher_signal.js
      - run: python3 scripts/test_package_npm.py
      - run: python3 scripts/verify_inspector_fixture.py
      - run: python3 scripts/test_main_container_publish.py
      - run: python3 scripts/test_verify_container_index.py
      - run: python3 scripts/test_verify_release_manifest.py
      - run: python3 scripts/test_release_approval_policy.py
      - run: python3 scripts/test_package_release_docs.py

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.99.1
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: python3 scripts/verify_icon_resource.py
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.99.1
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: request_guard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_guard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/request_guard_test
      REQUIRE_TEST_BACKENDS: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require real Redis and PostgreSQL round trip
        run: |
          set -euo pipefail
          if ! output=$(cargo test --locked --all-features --test backend_integrations \
            redis_and_postgres_backed_tools_complete_real_round_trip -- --exact --nocapture 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -Fq 'running real Redis and PostgreSQL integration round trip' <<< "$output"
          grep -Eq 'test result: ok\. 1 passed;' <<< "$output"
      - run: cargo test --all-features

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo +1.89.0 test --locked --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --all-features
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
      - run: python3 scripts/probe_npm_parent_pipe.py target/release/request-guard-mcp
      - run: python3 scripts/probe_validate_payload.py target/release/request-guard-mcp
      - run: python3 scripts/probe_score_breakdown.py target/release/request-guard-mcp
      - run: python3 scripts/probe_self_test_suite.py target/release/request-guard-mcp
      - run: python3 scripts/probe_canary_shape.py target/release/request-guard-mcp
      - run: python3 scripts/probe_batch_details.py target/release/request-guard-mcp
      - run: python3 scripts/probe_sigterm_shutdown.py target/release/request-guard-mcp
      - run: python3 scripts/probe_accept_recovery.py target/release/request-guard-mcp
      - run: python3 scripts/probe_ws_non_reader.py target/release/request-guard-mcp
      - run: python3 -m venv /tmp/ws-caller-probe && /tmp/ws-caller-probe/bin/pip install websockets==15.0.1
      - run: /tmp/ws-caller-probe/bin/python scripts/probe_ws_caller_fairness.py --binary target/release/request-guard-mcp
      - run: python3 scripts/probe_http1_request_budget.py target/release/request-guard-mcp
      - run: python3 scripts/probe_json_complexity.py target/release/request-guard-mcp
      - run: python3 scripts/probe_unsupported_redis_tls.py target/release/request-guard-mcp
      - run: python3 scripts/test_adversarial_probe.py
      - name: Adversarial HTTP and WebSocket smoke
        run: python3 scripts/ci_adversarial_smoke.py --binary target/release/request-guard-mcp
      - name: Bounded loopback ingress proxy probe
        timeout-minutes: 5
        run: |
          if ! command -v nginx >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends nginx
          fi
          python3 scripts/probe_nginx_ingress.py target/release/request-guard-mcp

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  deny:
    name: Dependency Deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - run: cargo deny check
