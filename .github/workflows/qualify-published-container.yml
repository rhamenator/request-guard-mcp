name: Qualify Published Container

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Immutable GHCR index digest (sha256: followed by 64 lowercase hex characters)"
        required: true
        type: string
      source_commit:
        description: "Full source commit expected in the running image (40 lowercase hex characters)"
        required: true
        type: string
      source_version:
        description: "Cargo package version expected in the running image"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  native-smoke:
    name: Published container smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke exact published index digest on native runner
        env:
          DIGEST: ${{ inputs.digest }}
          ARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          python3 scripts/smoke_native_container.py \
            --image "ghcr.io/rhamenator/request-guard-mcp@$DIGEST" --arch "$ARCH" \
            --expected-commit "$SOURCE_COMMIT" --expected-version "$SOURCE_VERSION"
          printf 'Published index %s passed native %s bounded smoke\n' "$DIGEST" "$ARCH" >> "$GITHUB_STEP_SUMMARY"
