name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build ${{ matrix.platform }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            suffix: .exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
            suffix: ""
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            suffix: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          python scripts/package_release.py \
            --version "${GITHUB_REF_NAME}" \
            --target "${{ matrix.target }}" \
            --platform "${{ matrix.platform }}" \
            --suffix "${{ matrix.suffix }}"
      - name: Smoke test packaged server
        shell: bash
        run: |
          python scripts/smoke_release.py \
            --artifacts artifacts \
            --binary "request-guard-mcp${{ matrix.suffix }}" \
            --port 18766
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: request-guard-mcp-${{ matrix.platform }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/
          pattern: request-guard-mcp-*
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
