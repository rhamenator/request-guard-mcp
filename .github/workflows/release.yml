name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Version label for an unpublished candidate (Actions artifacts readable by repository readers)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.candidate_version || github.ref_name }}

jobs:
  verify-release-ref:
    name: Verify release version and source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate version, lockfile, and tag ancestry
        env:
          INPUT_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: python scripts/verify_release_ref.py
      - name: Verify Windows icon resource matches source
        run: python3 scripts/verify_icon_resource.py

  stable-tag-approval:
    name: Approve v1+ release tag
    needs: verify-release-ref
    # A v1 prerelease is public too. Pause every v1+ tag for owner review.
    if: github.event_name == 'push' && github.ref_type == 'tag' && !startsWith(github.ref_name, 'v0.')
    runs-on: ubuntu-latest
    environment: stable-release
    permissions:
      contents: read
    steps:
      - run: echo 'v1+ release approved by the protected environment reviewer.'

  build-release:
    name: Build ${{ matrix.platform }} binary
    needs: [verify-release-ref, stable-tag-approval]
    # Approval may be skipped only for private dispatch or experimental v0 tags.
    if: ${{ !cancelled() && needs.verify-release-ref.result == 'success' && (needs.stable-tag-approval.result == 'success' || (needs.stable-tag-approval.result == 'skipped' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v0.'))))) }}
    env:
      # Keep every native release lane on the same reviewed toolchain.
      RUSTUP_TOOLCHAIN: '1.99.1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            suffix: ""
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            suffix: .exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
            suffix: ""
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            suffix: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl=1.2.4-2 musl-dev=1.2.4-2 musl-tools=1.2.4-2
          {
            echo '### musl build provenance'
            echo 'Runner: ubuntu-24.04'
            dpkg-query -W -f='${Package} ${Version}\n' musl musl-dev musl-tools
            rustc --version --verbose
            musl-gcc -dumpfullversion
            gcc --version | head -1
          } | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version | grep -Fq 'rustc 1.99.1 '
          rustup target list --installed | grep -Fxq x86_64-unknown-linux-musl
      - name: Record native build inputs and build
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          rust_version=$(rustc --version)
          [[ "$rust_version" == 'rustc 1.99.1 '* ]]
          rustup target list --installed | grep -Fxq '${{ matrix.target }}'
          export GIT_COMMIT="$commit"
          export BUILD_DATE
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          export RUST_VERSION="$rust_version"
          {
            echo "Commit: $GIT_COMMIT"
            echo "Build date (UTC): $BUILD_DATE"
            echo "Rust: $RUST_VERSION"
            echo "Target: ${{ matrix.target }}"
          } >> "$GITHUB_STEP_SUMMARY"
          cargo build --release --locked --target '${{ matrix.target }}'
      - name: Package
        shell: bash
        run: |
          python scripts/package_release.py \
            --version "${RELEASE_VERSION}" \
            --target "${{ matrix.target }}" \
            --platform "${{ matrix.platform }}" \
            --suffix "${{ matrix.suffix }}" \
            --source-commit "$(git rev-parse HEAD)" \
            --repository "${GITHUB_REPOSITORY}"
      - name: Verify checksum and extract release archive
        shell: bash
        run: |
          suffix=tar.gz
          if [[ "${{ matrix.platform }}" == windows-* ]]; then suffix=zip; fi
          folder="request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}"
          python scripts/verify_release_archive.py \
            --archive "artifacts/${folder}.${suffix}" \
            --sidecar "artifacts/${folder}.${suffix}.sha256" \
            --staging-binary "artifacts/${folder}/request-guard-mcp${{ matrix.suffix }}" \
            --output verified-release \
            --folder "$folder" \
            --binary "request-guard-mcp${{ matrix.suffix }}" \
            --version "${RELEASE_VERSION}" \
            --source-commit "$(git rev-parse HEAD)" \
            --repository "${GITHUB_REPOSITORY}"
      - name: Assert static PIE without interpreter or shared dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          binary="verified-release/request-guard-mcp-${RELEASE_VERSION}-linux-x64-musl/request-guard-mcp"
          elf_header=$(readelf -h "$binary")
          grep -Eq 'Type:.*DYN' <<< "$elf_header"
          program_headers=$(readelf -l "$binary")
          dynamic_entries=$(readelf -d "$binary")
          if grep -q INTERP <<< "$program_headers"; then
            echo 'musl release binary has an ELF interpreter' >&2
            exit 1
          fi
          if grep -q '(NEEDED)' <<< "$dynamic_entries"; then
            echo 'musl release binary needs a shared library' >&2
            exit 1
          fi
      - name: Smoke test packaged server
        shell: bash
        run: |
          python scripts/smoke_release.py \
            --artifacts artifacts \
            --binary "request-guard-mcp${{ matrix.suffix }}" \
            --port 18766
      - name: Smoke test packaged stdio transport
        shell: bash
        run: |
          python scripts/stdio_release_smoke.py \
            --binary "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}" \
            --expected-version "$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
      - name: Check extracted binary via npm HTTP wrapper forced-kill cleanup
        shell: bash
        run: |
          python scripts/probe_npm_parent_pipe_portable.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check clean installed npm shim forced-kill cleanup
        shell: bash
        run: |
          python scripts/probe_npm_installed_shim.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged payload validation
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_validate_payload.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged score breakdown input
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_score_breakdown.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged self-test suite selection
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_self_test_suite.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check first-call health uptime
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_health_uptime.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged canary context argument shape
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_canary_shape.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged redaction preview input shape
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_redact_preview_shape.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged user-agent risk hint
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_enrich_ua_risk.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged sensitive path boundaries
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_sensitive_path_boundaries.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged explanation consistency
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_explain_consistency.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged operational tool inputs
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_operational_tools.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged threat lookup inputs
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_threat_lookup_shape.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged batch details and errors
        shell: bash
        run: |
          python scripts/probe_batch_details.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Check packaged classification metadata fields
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/probe_classify_unknown_fields.py \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Verify packaged source and toolchain metadata
        shell: bash
        run: |
          python scripts/verify_release_build_info.py \
            --binary "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}" \
            --expected-version "$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')" \
            --expected-commit "$(git rev-parse HEAD)" \
            --expected-rust-version "$(rustc --version)"
      - name: Smoke test musl binary in Alpine
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/smoke_alpine_musl.py \
            --binary "verified-release/request-guard-mcp-${RELEASE_VERSION}-linux-x64-musl/request-guard-mcp" \
            --expected-version "$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
      - name: Run official MCP Inspector inside Alpine
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python scripts/inspector_alpine_musl.py \
            --binary "verified-release/request-guard-mcp-${RELEASE_VERSION}-linux-x64-musl/request-guard-mcp" \
            --expected-version "$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
      - name: Check Redis outage and recovery inside Alpine
        if: matrix.target == 'x86_64-unknown-linux-musl'
        timeout-minutes: 5
        shell: bash
        run: |
          python scripts/smoke_alpine_redis.py \
            --binary "verified-release/request-guard-mcp-${RELEASE_VERSION}-linux-x64-musl/request-guard-mcp" \
            --expected-version "$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
      - name: Check PostgreSQL outage and recovery inside Alpine
        if: matrix.target == 'x86_64-unknown-linux-musl'
        timeout-minutes: 6
        shell: bash
        run: |
          python scripts/smoke_alpine_postgres.py \
            --binary "verified-release/request-guard-mcp-${RELEASE_VERSION}-linux-x64-musl/request-guard-mcp" \
            --expected-version "$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
      - name: Check PostgreSQL TLS trust inside Alpine
        if: matrix.target == 'x86_64-unknown-linux-musl'
        timeout-minutes: 6
        shell: bash
        run: |
          python scripts/smoke_alpine_postgres_tls.py \
            --binary "verified-release/request-guard-mcp-${RELEASE_VERSION}-linux-x64-musl/request-guard-mcp" \
            --expected-version "$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
      - name: Check trusted and untrusted OTLP TLS inside Alpine
        if: matrix.target == 'x86_64-unknown-linux-musl'
        timeout-minutes: 6
        shell: bash
        run: |
          python scripts/smoke_alpine_otlp_tls.py \
            --binary "verified-release/request-guard-mcp-${RELEASE_VERSION}-linux-x64-musl/request-guard-mcp" \
            --expected-version "$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
      - name: Verify standard MCP calls with official Inspector
        shell: bash
        run: |
          python scripts/inspector_smoke.py \
            --expected-version "$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')" \
            "verified-release/request-guard-mcp-${RELEASE_VERSION}-${{ matrix.platform }}/request-guard-mcp${{ matrix.suffix }}"
      - name: Verify archive checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum -c *.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: request-guard-mcp-${{ matrix.platform }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 7

  attest-native-provenance:
    name: Attest and verify tagged native archives
    needs: build-release
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.build-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
          pattern: request-guard-mcp-*
          merge-multiple: true
      - name: Verify five archives and sidecars before attesting
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          [[ $(find . -maxdepth 1 -type f -name '*.sha256' | wc -l) -eq 5 ]]
          [[ $(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l) -eq 4 ]]
          [[ $(find . -maxdepth 1 -type f -name '*.zip' | wc -l) -eq 1 ]]
          sha256sum -c ./*.sha256
      - name: Attest native tar archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/*.tar.gz
      - name: Attest native Windows archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/*.zip
      - name: Verify signed source provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts
          for archive in ./*.tar.gz ./*.zip; do
            verified=0
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$archive" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$(git -C .. rev-parse HEAD)" \
                --source-ref "$GITHUB_REF" >/dev/null; then
                verified=1
                break
              fi
              sleep 3
            done
            [[ "$verified" == 1 ]]
            echo "Verified native attestation for $archive"
          done

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify-release-ref, build-release, attest-native-provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
          pattern: request-guard-mcp-*
          merge-multiple: true
      - name: Reverify exact downloaded assets and signed source provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_manifest.py --artifacts artifacts --version "$RELEASE_VERSION"
          for archive in artifacts/*.tar.gz artifacts/*.zip; do
            verified=0
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$archive" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$GITHUB_SHA" \
                --source-ref "$GITHUB_REF" >/dev/null; then
                verified=1
                break
              fi
              sleep 3
            done
            [[ "$verified" == 1 ]]
          done
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*-windows-x64.zip
            artifacts/*-windows-x64.zip.sha256
            artifacts/*-linux-x64.tar.gz
            artifacts/*-linux-x64.tar.gz.sha256
            artifacts/*-linux-x64-musl.tar.gz
            artifacts/*-linux-x64-musl.tar.gz.sha256
            artifacts/*-macos-x64.tar.gz
            artifacts/*-macos-x64.tar.gz.sha256
            artifacts/*-macos-arm64.tar.gz
            artifacts/*-macos-arm64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
