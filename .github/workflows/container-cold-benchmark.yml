name: Container Cold Build Benchmark

# Manual, unpublished experiment for issue #88. This does not replace the
# required container check or publish anything to GHCR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-cold-build:
    name: Cold native ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify native runner architecture
        run: |
          set -euo pipefail
          expected='${{ matrix.arch }}'
          case "$expected:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Unexpected runner architecture" >&2; exit 1 ;;
          esac
          echo "Runner $(uname -m)" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Start cold build timer
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build native image without BuildKit cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/${{ matrix.arch }}
          no-cache: true
          load: true
          push: false
          tags: request-guard-mcp:cold-${{ matrix.arch }}
      - name: Verify image and record cold duration
        run: |
          set -euo pipefail
          image_arch=$(docker image inspect request-guard-mcp:cold-${{ matrix.arch }} --format '{{.Architecture}}')
          test "$image_arch" = '${{ matrix.arch }}'
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          {
            echo "### Unpublished native ${{ matrix.arch }} cold image"
            echo "- Build and load elapsed: ${elapsed} seconds"
            echo "- BuildKit layer cache: disabled (no-cache: true)"
            echo "- Loaded image architecture: ${image_arch}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Run attempt: ${{ github.run_attempt }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the native image
        run: |
          set -euo pipefail
          name="request-guard-cold-${{ matrix.arch }}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --network bridge \
            -e AUTH_TOKENS=0123456789abcdef0123456789abcdef \
            request-guard-mcp:cold-${{ matrix.arch }} >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$name" curl -fsS --max-time 2 \
                http://127.0.0.1:8085/health >/dev/null 2>&1; then
              echo "Native image health smoke: passed" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 1
          done
          echo "Native image health smoke failed" >&2
          exit 1

  controlled-oci-build:
    name: Controlled OCI ${{ matrix.mode }} image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: native-amd64
            runner: ubuntu-24.04
            platforms: linux/amd64
          - mode: native-arm64
            runner: ubuntu-24.04-arm
            platforms: linux/arm64
          - mode: combined
            runner: ubuntu-24.04
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify runner architecture
        run: |
          set -euo pipefail
          case '${{ matrix.mode }}:'"$(uname -m)" in
            native-amd64:x86_64|native-arm64:aarch64|combined:x86_64) ;;
            *) echo 'Unexpected runner architecture' >&2; exit 1 ;;
          esac
      - name: Set up arm64 emulation for the combined baseline
        if: matrix.mode == 'combined'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Start controlled build timer
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build OCI archive without BuildKit cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: SOURCE_COMMIT=${{ github.sha }}
          platforms: ${{ matrix.platforms }}
          no-cache: true
          push: false
          outputs: type=oci,dest=/tmp/request-guard-cold.oci.tar
      - name: Stop controlled build timer
        id: duration
        run: echo "elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))" >> "$GITHUB_OUTPUT"
      - name: Verify archive platforms and record elapsed time
        env:
          EXPECTED_PLATFORMS: ${{ matrix.platforms }}
          RUN_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import tarfile

          expected = set(os.environ['EXPECTED_PLATFORMS'].split(','))
          with tarfile.open('/tmp/request-guard-cold.oci.tar', 'r') as archive:
              def read_json(path):
                  member = archive.getmember(path)
                  if member.size > 2_000_000:
                      raise SystemExit(f'OCI metadata missing or oversized: {path}')
                  entry = archive.extractfile(member)
                  if entry is None:
                      raise SystemExit(f'OCI metadata missing: {path}')
                  return json.load(entry)

              def blob(digest):
                  algorithm, value = digest.split(':', 1)
                  if algorithm != 'sha256' or len(value) != 64:
                      raise SystemExit('unsupported OCI blob digest')
                  return read_json(f'blobs/sha256/{value}')

              actual = set()

              def visit(descriptor, depth=0):
                  if depth > 4:
                      raise SystemExit('OCI index nesting is too deep')
                  media_type = descriptor.get('mediaType', '')
                  document = blob(descriptor['digest'])
                  if media_type.endswith('image.index.v1+json') or media_type.endswith('manifest.list.v2+json'):
                      for child in document.get('manifests', []):
                          visit(child, depth + 1)
                  elif media_type.endswith('image.manifest.v1+json') or media_type.endswith('manifest.v2+json'):
                      platform = descriptor.get('platform', {})
                      if platform.get('os') != 'linux':
                          platform = blob(document['config']['digest'])
                      if platform.get('os') == 'linux':
                          actual.add(f"{platform['os']}/{platform['architecture']}")
                  else:
                      raise SystemExit(f'unsupported OCI media type: {media_type}')

              for descriptor in read_json('index.json').get('manifests', []):
                  visit(descriptor)
          if actual != expected:
              raise SystemExit(f'OCI platforms {sorted(actual)} != {sorted(expected)}')
          print(f"Verified OCI platforms: {', '.join(sorted(actual))}")
          PY
          {
            echo "### Controlled no-cache OCI $RUN_MODE"
            echo "- Platforms: $EXPECTED_PLATFORMS"
            echo "- Build and OCI export elapsed: ${{ steps.duration.outputs.elapsed }} seconds"
            echo "- Commit: ${{ github.sha }}; attempt: ${{ github.run_attempt }}"
            echo "- No registry login, push, or artifact upload"
          } >> "$GITHUB_STEP_SUMMARY"
