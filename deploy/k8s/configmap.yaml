apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config
  namespace: request-guard
data:
  log_level: "info"
  redis_key_prefix: "request_guard"
  redis_cache_ttl_secs: "300"
  max_request_bytes: "1048576"
  max_batch_size: "50"
  global_concurrency: "256"
  per_tool_timeout_secs: "30"
  classify_timeout_secs: "5"
