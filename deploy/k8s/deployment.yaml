apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-guard-mcp
  namespace: request-guard
  labels:
    app: request-guard-mcp
    version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: request-guard-mcp
  template:
    metadata:
      labels:
        app: request-guard-mcp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: mcp
          image: ghcr.io/rhamenator/request-guard-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
              protocol: TCP
          env:
            - name: MCP__HOST
              value: "0.0.0.0"
            - name: MCP__PORT
              value: "8085"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: log_level
            - name: AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: auth_tokens
            - name: CACHE_SCOPE_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: cache_scope_hmac_key
            - name: TLS_FINGERPRINT_ATTESTATION_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: tls_fingerprint_attestation_key
            - name: TLS_FINGERPRINT_ATTESTATION_PREVIOUS_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: tls_fingerprint_attestation_previous_key
                  optional: true
            - name: TLS_FINGERPRINT_ATTESTATION_MAX_AGE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: tls_fingerprint_attestation_max_age_seconds
            - name: TLS_KNOWN_BAD_JA3
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: tls_known_bad_ja3
            - name: TLS_KNOWN_BAD_JA4
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: tls_known_bad_ja4
            - name: MCP__REDIS__URL
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: redis_url
                  optional: true
            - name: MCP__REDIS__KEY_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: redis_key_prefix
            - name: MCP__REDIS__CACHE_TTL_SECS
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: redis_cache_ttl_secs
            - name: MCP__POSTGRES__URL
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: postgres_url
                  optional: true
            - name: MCP__LIMITS__MAX_REQUEST_BYTES
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: max_request_bytes
            - name: MCP__LIMITS__MAX_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: max_batch_size
            - name: MCP__LIMITS__GLOBAL_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: global_concurrency
            - name: MCP__LIMITS__MAX_CONNECTIONS
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: max_connections
            - name: MCP__LIMITS__WEBSOCKET_IDLE_TIMEOUT_SECS
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: websocket_idle_timeout_secs
            - name: MCP__LIMITS__PER_TOOL_TIMEOUT_SECS
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: per_tool_timeout_secs
            - name: MCP__LIMITS__CLASSIFY_TIMEOUT_SECS
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: classify_timeout_secs
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
