# Example Secret manifest - DO NOT commit real values.
# Encode values with: echo -n "value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: mcp-secrets
  namespace: request-guard
type: Opaque
stringData:
  # Use a separate random >=32-byte key for per-caller cache scopes.
  cache_scope_hmac_key: replace_me_with_32_or_more_random_bytes
  # Replace with a random >=32-byte key shared only with trusted producers.
  tls_fingerprint_attestation_key: replace_me_with_32_or_more_random_bytes
  # Set only during a rolling rotation, then remove after the grace period.
  # tls_fingerprint_attestation_previous_key: replace_me_with_the_old_random_key
data:
  # base64("replace_me_with_a_strong_token")
  auth_tokens: cmVwbGFjZV9tZV93aXRoX2Ffc3Ryb25nX3Rva2Vu
  # base64("replace_me_with_a_strong_redis_password")
  redis_password: cmVwbGFjZV9tZV93aXRoX2Ffc3Ryb25nX3JlZGlzX3Bhc3N3b3Jk
  # base64("redis://:replace_me_with_a_strong_redis_password@redis:6379")
  redis_url: cmVkaXM6Ly86cmVwbGFjZV9tZV93aXRoX2Ffc3Ryb25nX3JlZGlzX3Bhc3N3b3JkQHJlZGlzOjYzNzk=
