[advisories]
ignore = [
    # rsa: Marvin Attack timing side-channel, no fixed upgrade available upstream.
    # rsa is pulled in only as an optional dependency of sqlx's MySQL backend
    # (sqlx always lists sqlx-mysql as a resolvable optional dep regardless of
    # which backend feature is selected). We build with default-features = false
    # and only enable the "postgres" feature, so sqlx-mysql/rsa are never
    # compiled into the binary.
    "RUSTSEC-2023-0071",
    # libsqlite3-sys 0.30.1 (RUSTSEC-2026-0459): present only in Cargo.lock as an
    # optional dependency of sqlx-sqlite. We build sqlx with default-features = false
    # and only the "postgres" feature, so SQLite is never compiled or linked
    # (`cargo tree -i libsqlite3-sys` prints nothing). Same reason as the rsa entry.
    # Review again when sqlx releases a version that resolves libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",
    # chrono 0.4.x (RUSTSEC-2026-0543): flagged as unmaintained, with no known
    # vulnerability. It is a compiled dependency used for timestamps. Replacing it
    # is a separate change; owner: maintainers, review by 2027-02-01.
    "RUSTSEC-2026-0543",
]
